<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img"
     aria-label="AI 翻译示意：从学习面板页脚的入口打开设置弹层，填服务商、接口地址、模型、Key 与目标语言后按句翻译，结果同时写进学习面板、桌面浮窗与导出文件">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
           "Noto Sans CJK SC", system-ui, sans-serif; }
    .t      { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .note   { font-size: 12.5px; fill: #57606a; }
    .tip    { font-size: 11.5px; fill: #7f8c9b; }
    .card   { fill: #ffffff; stroke: #d8dee4; stroke-width: 1.5; }
    .head   { fill: #f6f8fa; }
    .dark   { fill: #1b1e24; stroke: #2c313a; stroke-width: 1.5; }
    .field  { fill: #23272e; stroke: #343a44; stroke-width: 1.2; }
    .flabel { font-size: 11.5px; fill: #9aa4b2; }
    .fvalue { font-size: 12px; fill: #e8eaed; }
    .fkey   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              font-size: 11.5px; fill: #c9d1d9; }
    .btn    { fill: #23272e; stroke: #343a44; stroke-width: 1.2; }
    .bt     { font-size: 11.5px; fill: #c9d1d9; }
    .primary{ fill: #1b3a5c; stroke: #3d7ebf; stroke-width: 1.4; }
    .bton   { font-size: 11.5px; fill: #cfe4ff; }
    .hl     { fill: #e8f1fd; stroke: #9dc2ee; stroke-width: 1.3; }
    .ja     { font-size: 13px; fill: #3d444d; }
    .zh     { font-size: 11.5px; fill: #6e7781; }
    .now    { font-size: 14px; fill: #1f2328; }
    .nowzh  { font-size: 12px; fill: #57606a; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="699" rx="16" fill="#ffffff" stroke="#e4e8ec"/>

  <text class="t" x="30" y="44">AI 翻译：填自己的 API Key，按句翻整条原文</text>
  <text class="note" x="330" y="44">—— 官方译文不理想时的替代方案；Key 只存在本机，只发给你填的那个接口</text>

  <!-- 学习面板（左侧） -->
  <rect class="card" x="40" y="76" width="320" height="414" rx="12"/>
  <rect class="head" x="40" y="76" width="320" height="38" rx="12"/>
  <rect class="head" x="40" y="100" width="320" height="14"/>
  <text class="t" x="58" y="101">学习面板</text>
  <text class="tip" x="342" y="101" text-anchor="end">400px</text>
  <line x1="40" y1="114" x2="360" y2="114" stroke="#e4e8ec"/>

  <text class="ja" x="58" y="146">あさごはんを 食べた</text>
  <text class="zh" x="58" y="164">吃了早饭。</text>

  <rect x="50" y="182" width="300" height="58" rx="8" fill="#eaf3ff"/>
  <rect x="50" y="182" width="3" height="58" rx="1.5" fill="#3d7ebf"/>
  <text class="now" x="62" y="206">昨日 買った 本を 読む</text>
  <text class="nowzh" x="62" y="226">读昨天买的书。</text>

  <text class="ja" x="58" y="266">あしたは 図書館へ 行く</text>
  <text class="zh" x="58" y="284">明天去图书馆。</text>

  <text class="ja" x="58" y="318">この 映画は とても 長い</text>
  <text class="zh" x="58" y="336">这部电影很长。</text>

  <text class="tip" x="58" y="372">↑ 译文逐句写在原文下方；当前句高亮、点句跳转</text>

  <line x1="40" y1="392" x2="360" y2="392" stroke="#e4e8ec"/>
  <rect class="btn" x="56" y="404" width="96" height="26" rx="7"/>
  <text class="bt" x="104" y="421" text-anchor="middle">导出 Markdown</text>
  <rect class="btn" x="158" y="404" width="46" height="26" rx="7"/>
  <text class="bt" x="181" y="421" text-anchor="middle">SRT</text>
  <rect class="btn" x="210" y="404" width="70" height="26" rx="7"/>
  <text class="bt" x="245" y="421" text-anchor="middle">原文 SRT</text>
  <rect class="btn" x="286" y="404" width="60" height="26" rx="7"/>
  <text class="bt" x="316" y="421" text-anchor="middle">导入译文</text>

  <rect class="primary" x="56" y="440" width="70" height="26" rx="7"/>
  <text class="bton" x="91" y="457" text-anchor="middle">AI 翻译</text>
  <rect class="btn" x="132" y="440" width="46" height="26" rx="7"/>
  <text class="bt" x="155" y="457" text-anchor="middle">复制</text>
  <rect class="btn" x="184" y="440" width="46" height="26" rx="7"/>
  <text class="bt" x="207" y="457" text-anchor="middle">清空</text>

  <!-- AI 翻译弹层（右侧） -->
  <rect class="dark" x="400" y="76" width="520" height="414" rx="12"/>
  <text class="t" x="424" y="107" style="fill:#e8eaed">AI 翻译</text>
  <path d="M890 96 L900 106 M900 96 L890 106" stroke="#6b7280" stroke-width="1.6" fill="none"/>
  <line x1="400" y1="122" x2="920" y2="122" stroke="#2c313a"/>

  <text class="flabel" x="424" y="147">服务商</text>
  <rect class="field" x="496" y="132" width="400" height="26" rx="6"/>
  <text class="fvalue" x="508" y="149">DeepSeek</text>
  <path d="M874 142 L879 148 L884 142" stroke="#8b949e" stroke-width="1.4" fill="none"/>

  <text class="flabel" x="424" y="185">接口地址</text>
  <rect class="field" x="496" y="170" width="400" height="26" rx="6"/>
  <text class="fkey" x="508" y="187">https://api.deepseek.com/v1</text>

  <text class="flabel" x="424" y="223">模型</text>
  <rect class="field" x="496" y="208" width="400" height="26" rx="6"/>
  <text class="fkey" x="508" y="225">deepseek-chat</text>

  <text class="flabel" x="424" y="261">API Key</text>
  <rect class="field" x="496" y="246" width="400" height="26" rx="6"/>
  <text class="fkey" x="508" y="263">sk-••••••••••••••••</text>
  <text class="tip" x="880" y="263" text-anchor="end">仅本机 chrome.storage.local</text>

  <text class="flabel" x="424" y="299">目标语言</text>
  <rect class="field" x="496" y="284" width="400" height="26" rx="6"/>
  <text class="fvalue" x="508" y="301">简体中文</text>
  <path d="M874 294 L879 300 L884 294" stroke="#8b949e" stroke-width="1.4" fill="none"/>

  <rect x="424" y="324" width="13" height="13" rx="3" fill="#23272e" stroke="#3d7ebf" stroke-width="1.4"/>
  <path d="M427 330 L430 333 L434 327" stroke="#7db3f0" stroke-width="1.6" fill="none"/>
  <text class="fvalue" x="445" y="335">跳过已有译文的句子</text>

  <rect x="424" y="350" width="13" height="13" rx="3" fill="#23272e" stroke="#4a515c" stroke-width="1.4"/>
  <text class="fvalue" x="445" y="361">整片放进上下文（更准，更贵；需 64k+ 上下文模型）</text>

  <text class="tip" x="424" y="390">Key 只存在本机扩展存储里，只发给你填的接口。</text>

  <rect class="primary" x="424" y="404" width="88" height="28" rx="7"/>
  <text class="bton" x="468" y="423" text-anchor="middle">开始翻译</text>
  <rect class="btn" x="520" y="404" width="56" height="28" rx="7"/>
  <text class="bt" x="548" y="423" text-anchor="middle">停止</text>
  <rect class="btn" x="584" y="404" width="72" height="28" rx="7"/>
  <text class="bt" x="620" y="423" text-anchor="middle">清除 Key</text>
  <text class="tip" x="908" y="423" text-anchor="end">> 30 句先花一次请求读全片</text>

  <text class="tip" x="424" y="462">超过 30 句：先读一遍整片，产出主题 / 说话人 / 术语摘要；</text>
  <text class="tip" x="424" y="480">之后每 20 句带着摘要去翻，整片过长会自动退回分段。</text>

  <!-- 结果流向 -->
  <text class="note" x="30" y="530">点「开始翻译」之后：每批（20 句）回来立刻落盘，中途「停止」也不会丢已经翻好的句子；结果同时写进三处。</text>

  <line x1="660" y1="490" x2="660" y2="548" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="660" y1="518" x2="190" y2="518" stroke="#8b949e" stroke-width="1.4"/>
  <line x1="190" y1="518" x2="190" y2="548" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="660" y1="518" x2="790" y2="518" stroke="#8b949e" stroke-width="1.4"/>
  <line x1="790" y1="518" x2="790" y2="548" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect class="card" x="60" y="554" width="260" height="104" rx="10"/>
  <text class="t" x="78" y="580">学习面板</text>
  <text class="note" x="78" y="604">逐句原文 + 译文，当前句高亮；</text>
  <text class="note" x="78" y="624">点句跳转，原文改动时自动重排。</text>
  <text class="tip" x="78" y="646">与官方译文同一条渲染路径</text>

  <rect class="card" x="350" y="554" width="260" height="104" rx="10"/>
  <text class="t" x="368" y="580">桌面字幕浮窗</text>
  <text class="note" x="368" y="604">播到哪句就显示哪句的译文；</text>
  <text class="note" x="368" y="624">上一句 / 当前句 / 下一句三段。</text>
  <text class="tip" x="368" y="646">最小化浏览器后仍在桌面上</text>

  <rect class="card" x="640" y="554" width="260" height="104" rx="10"/>
  <text class="t" x="658" y="580">导出文件</text>
  <text class="note" x="658" y="604">Markdown 中日对照、双语 SRT、</text>
  <text class="note" x="658" y="624">复制到剪贴板 —— 都是译后内容。</text>
  <text class="tip" x="658" y="646">也能先导原文 SRT，外部翻好再贴回</text>
</svg>
